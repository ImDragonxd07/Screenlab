name: Update Code Stats

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tokei
        run: cargo install tokei --locked

      - name: Generate stats
        run: |
          tokei --output json > tokei.json
          
          FILES=$(jq '[.[] | .reports | length] | add // 0' tokei.json)
          CODE=$(jq '[.[] | .code | tonumber] | add // 0' tokei.json)
          COMMENTS=$(jq '[.[] | .comments | tonumber] | add // 0' tokei.json)
          
          # Get current date
          UPDATED=$(date -u +"%B %d, %Y")
          
          cat > stats.txt << EOF 

          <div align="center">
          
          ![Files](https://img.shields.io/badge/Files-${FILES}-blue?style=for-the-badge&logo=files)
          ![Lines of Code](https://img.shields.io/badge/Lines_of_Code-${CODE}-green?style=for-the-badge&logo=codelines)
          ![Comments](https://img.shields.io/badge/Comments-${COMMENTS}-yellow?style=for-the-badge&logo=comment)
          ![Last Updated](https://img.shields.io/badge/Last_Updated-${UPDATED}-purple?style=for-the-badge&logo=calendar)
          
          </div>
          EOF
          
          awk '
            /<!-- STATS_START -->/ {print; system("cat stats.txt"); f=1; next}
            /<!-- STATS_END -->/ {f=0}
            !f
          ' readme.md > readme.tmp
          mv readme.tmp readme.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add readme.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update code stats [skip ci]"
            git push
          fi