name: Update Code Stats

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Add this - required for pushing
permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install jq for JSON parsing
          sudo apt-get update
          sudo apt-get install -y jq
          
          # Install tokei
          curl -L https://github.com/XAMPPRocky/tokei/releases/latest/download/tokei-x86_64-unknown-linux-gnu.tar.gz \
            -o tokei.tar.gz
          tar xzf tokei.tar.gz
          sudo mv tokei /usr/local/bin/
          tokei --version

      - name: Generate stats
        run: |
          tokei --output json > tokei.json
          
          # Get stats with fallback to 0 if null
          FILES=$(jq '[.[] | .reports | length] | add // 0' tokei.json)
          CODE=$(jq '[.[] | .code] | add // 0' tokei.json)
          
          # Create stats block
          cat > stats.txt << EOF
          ## 📊 Project Stats
          - Files: ${FILES}
          - Lines of Code: ${CODE}
          EOF
          
          # Replace content between markers
          awk '
            /<!-- STATS_START -->/ {print; system("cat stats.txt"); f=1; next}
            /<!-- STATS_END -->/ {f=0}
            !f
          ' README.md > README.tmp
          mv README.tmp README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update code stats [skip ci]"
            git push
          fi