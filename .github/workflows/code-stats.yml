name: Update Code Stats

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tokei
        run: cargo install tokei --locked

      - name: Generate stats
        run: |
          tokei --output json > tokei.json
          
          FILES=$(jq '[.[] | .reports | length] | add // 0' tokei.json)
          CODE=$(jq '[.[] | .code] | add // 0' tokei.json)
          
          cat > stats.txt << EOF
          ## 📊 Project Stats
          - Files: ${FILES}
          - Lines of Code: ${CODE}
          EOF
          
          awk '
            /<!-- STATS_START -->/ {print; system("cat stats.txt"); f=1; next}
            /<!-- STATS_END -->/ {f=0}
            !f
          ' README.md > README.tmp
          mv README.tmp README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update code stats [skip ci]"
            git push
          fi