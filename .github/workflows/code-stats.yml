name: Update Code Stats

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tokei
        run: cargo install tokei --locked

      - name: Generate stats
        run: |
          tokei --output json > tokei.json
          
          FILES=$(jq '[.[] | .reports | length] | add // 0' tokei.json)
          CODE=$(jq '[.[] | .code | tonumber] | add // 0' tokei.json)
          COMMENTS=$(jq '[.[] | .comments | tonumber] | add // 0' tokei.json)
          BLANKS=$(jq '[.[] | .blanks | tonumber] | add // 0' tokei.json)
          
          # Format numbers with commas
          FILES_FMT=$(printf "%'d" $FILES)
          CODE_FMT=$(printf "%'d" $CODE)
          COMMENTS_FMT=$(printf "%'d" $COMMENTS)
          BLANKS_FMT=$(printf "%'d" $BLANKS)
          
          cat > stats.txt << EOF
          ## 📊 Project Statistics
          
          <div align="center">
          
          ![Files](https://img.shields.io/badge/Files-${FILES}-blue?style=for-the-badge&logo=files)
          ![Lines of Code](https://img.shields.io/badge/Lines_of_Code-${CODE}-green?style=for-the-badge&logo=codelines)
          ![Comments](https://img.shields.io/badge/Comments-${COMMENTS}-yellow?style=for-the-badge&logo=comment)
          ![Blank Lines](https://img.shields.io/badge/Blank_Lines-${BLANKS}-lightgrey?style=for-the-badge)
          
          </div>
          
          ---
          
          <table align="center">
          <tr>
          <td align="center"><b>📁 Total Files</b></td>
          <td align="center"><b>💻 Lines of Code</b></td>
          <td align="center"><b>💬 Comments</b></td>
          <td align="center"><b>⬜ Blank Lines</b></td>
          </tr>
          <tr>
          <td align="center"><code>${FILES_FMT}</code></td>
          <td align="center"><code>${CODE_FMT}</code></td>
          <td align="center"><code>${COMMENTS_FMT}</code></td>
          <td align="center"><code>${BLANKS_FMT}</code></td>
          </tr>
          </table>
          EOF
          
          awk '
            /<!-- STATS_START -->/ {print; system("cat stats.txt"); f=1; next}
            /<!-- STATS_END -->/ {f=0}
            !f
          ' readme.md > readme.tmp
          mv readme.tmp readme.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add readme.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update code stats [skip ci]"
            git push
          fi